<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKYCRUMB Studio — Hồ sơ Tài khoản &amp; Lịch sử Đơn hàng</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230284c7'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='11' font-weight='800' fill='white' text-anchor='middle'%3ESKY%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/commerce.css" />
  <link rel="stylesheet" href="./styles/subpage-shell.css" />
  <style>
    .acc-shell {
      max-width: 1200px;
      margin: 26px auto 54px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .acc-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(2, 132, 199, 0.18);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 12px 32px rgba(7, 26, 51, 0.06);
    }
    .acc-avatar-lg {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #071a33, #0284c7);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }
    .acc-profile-top {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(2, 132, 199, 0.14);
      margin-bottom: 16px;
    }
    .acc-nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .acc-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: #071a33;
      text-decoration: none;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .acc-nav-btn svg { width: 17px; height: 17px; color: #0284c7; flex-shrink: 0; }
    .acc-nav-btn:hover, .acc-nav-btn.active {
      background: rgba(224, 242, 254, 0.72);
      border-color: rgba(2, 132, 199, 0.25);
      color: #0369a1;
    }
    .acc-nav-btn.is-admin {
      background: linear-gradient(135deg, #071a33, #0369a1);
      color: #ffffff;
    }
    .acc-nav-btn.is-admin svg { color: #7dd3fc; }
    .acc-nav-btn.is-danger { color: #be123c; }
    .acc-nav-btn.is-danger svg { color: #be123c; }
    .acc-nav-btn.is-danger:hover { background: #fff1f2; border-color: #fecdd3; color: #9f1239; }
    .acc-kpi-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .acc-kpi-box {
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(240, 249, 255, 0.85);
      border: 1px solid rgba(2, 132, 199, 0.16);
    }
    .acc-kpi-box small { display: block; font-size: 0.72rem; font-weight: 700; color: #476282; text-transform: uppercase; letter-spacing: 0.04em; }
    .acc-kpi-box strong { display: block; margin-top: 4px; font-size: 1.18rem; font-weight: 800; color: #071a33; }
    .acc-order-item {
      border: 1px solid rgba(2, 132, 199, 0.18);
      border-radius: 16px;
      padding: 16px;
      background: #ffffff;
      margin-bottom: 12px;
    }
    .acc-order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(2, 132, 199, 0.12);
      margin-bottom: 10px;
    }
    .acc-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .acc-pill.ok { background: #dcfce7; color: #166534; }
    .acc-pill.warn { background: #fef3c7; color: #92400e; }
    .acc-pill.info { background: #e0f2fe; color: #0369a1; }
    .acc-track-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 14px;
    }
    .acc-track-form input {
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(2, 132, 199, 0.24);
      font: inherit;
      font-size: 0.85rem;
    }
    @media (max-width: 900px) {
      .acc-shell { grid-template-columns: 1fr; padding: 0 16px; }
      .acc-kpi-row { grid-template-columns: 1fr; }
      .acc-track-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-theme="sky">
  <header class="s25-topbar">
    <div class="tb-group">
      <a class="tb-item tb-logo icon" href="./index.html" aria-label="SKYCRUMB Studio — Trang chủ Studio 3D" title="SKYCRUMB Studio — Trang chủ Studio 3D"><span class="tb-mark"><svg class="tb-svg-stroke" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-9 5-9-5V8l9-5 9 5Z"/><path d="m3.27 6.96 8.73 4.88 8.73-4.88"/><path d="M12 22.08V12"/></svg></span></a>
      <a class="tb-item icon" href="./shop.html?cat=ALL" aria-label="Cửa hàng linh kiện" title="Cửa hàng linh kiện">
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M120-520v-320h320v320H120Zm0 400v-320h320v320H120Zm400-400v-320h320v320H520Zm0 400v-320h320v320H520Z"/></svg>
      </a>
      <a class="tb-item icon" href="./index.html?sec=3" aria-label="Phối cấu hình PC" title="Phối cấu hình PC">
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M444-444H240v-72h204v-204h72v204h204v72H516v204h-72v-204Z"/></svg>
      </a>
    </div>
    <div class="tb-group">
      <button type="button" class="tb-item tb-icon-badge tb-wish-btn" id="tbWishBtn" onclick="window.S25.openWishDrawer()" aria-label="Yêu thích" title="Sản phẩm yêu thích">
        <svg class="tb-svg-stroke" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span class="tb-badge wish-badge" id="tbWishBadge">0</span>
      </button>
      <a class="tb-item icon tb-auth-pill" id="tbAuthLink" href="./login.html" aria-label="Tài khoản" title="Tài khoản">
        <svg class="tb-svg-stroke nzxt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="8.75" rx="4.13" ry="4.5"/><path d="M3 20.75a9.1 6.5 0 0 1 18 0"/></svg>
      </a>
      <a class="tb-item tb-icon-badge" id="tbCartBtn" href="./cart.html" aria-label="Giỏ hàng" title="Giỏ hàng">
        <svg class="tb-svg-stroke nzxt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1,3 5,3 7.5,16 19,16 23,7 10,7"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
        <span class="tb-badge" data-s25-cart-badge>0</span>
      </a>
    </div>
  </header>

  <main class="acc-shell">
    <aside class="acc-card" id="accSidebar"></aside>
    <section style="display:flex;flex-direction:column;gap:20px;">
      <div class="acc-card" id="accOrdersCard">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
          <div>
            <div class="drawer-category-tag">SKYCRUMB STUDIO // HỒ SƠ &amp; ĐƠN HÀNG</div>
            <h1 style="font-size:1.45rem;font-weight:800;margin-top:4px;">Lịch sử Đơn hàng &amp; Giao vận</h1>
          </div>
          <a href="./shop.html?cat=ALL" class="sec3-btn-primary" style="text-decoration:none;">Tiếp tục mua sắm</a>
        </div>
        <div class="acc-kpi-row" id="accKpiRow"></div>
        <div id="accOrdersBody"></div>
      </div>

      <div class="acc-card" id="track">
        <div class="drawer-category-tag">TRA CỨU ĐƠN HÀNG TRỰC TIẾP TỪ CSDL ERP</div>
        <h2 style="font-size:1.15rem;font-weight:800;margin:4px 0 12px;">Kiểm tra trạng thái đơn hàng theo Mã vận đơn / SĐT</h2>
        <form class="acc-track-form" id="accTrackForm">
          <input type="text" id="accTrackCode" value="SKY-88921" placeholder="Mã đơn hàng (VD: SKY-88921, HD-B2B-2026-01)" />
          <input type="text" id="accTrackPhone" placeholder="Hoặc nhập Số điện thoại đặt hàng..." />
          <button type="submit" class="sec3-btn-primary" style="height:44px;">Tra cứu ngay</button>
        </form>
        <div id="accTrackResult"></div>
      </div>
    </section>
  </main>

  <footer id="s25FooterHost"></footer>

  <script src="./scripts/shared/commerce.js"></script>
  <script type="module" src="./scripts/pages/account.js"></script>
</body>
</html>
