<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTGShop Catalog Inspector — Kiểm tra toàn bộ 4 danh mục</title>
  <style>
    :root {
      --bg: #080b14;
      --surface: #111726;
      --surface-2: #171f33;
      --border: rgba(255, 255, 255, 0.09);
      --text: #eef3fb;
      --muted: #93a3bd;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --green: #34d399;
      --red: #f87171;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 20px 56px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      color: #031523;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.08); color: #031523; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .stat-card:hover, .stat-card.active {
      border-color: var(--accent);
      background: var(--surface-2);
    }
    .stat-card .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .stat-card .v { font-size: 22px; font-weight: 700; }
    .stat-card .m { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(8, 11, 20, 0.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    input[type="search"], select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }
    input[type="search"] { flex: 1 1 280px; }
    input[type="search"]:focus, select:focus { border-color: var(--accent); }
    .result-meta {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1060px;
      font-size: 13px;
    }
    th {
      text-align: left;
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: #fff;
      border: 1px solid var(--border);
      display: block;
    }
    .pname { font-weight: 600; color: var(--text); text-decoration: none; }
    .pname:hover { color: var(--accent); text-decoration: underline; }
    .pid { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: ui-monospace, monospace; }
    .specs {
      margin: 4px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .specs li { margin: 1px 0; }
    .price-sale { font-weight: 700; color: #f8fafc; white-space: nowrap; }
    .price-mkt { font-size: 11px; color: var(--muted); text-decoration: line-through; white-space: nowrap; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-ok { background: rgba(52, 211, 153, 0.14); color: var(--green); }
    .badge-out { background: rgba(248, 113, 113, 0.14); color: var(--red); }
    .badge-cat { background: var(--accent-soft); color: var(--accent); }
    .badge-off { background: rgba(251, 191, 36, 0.14); color: var(--amber); margin-left: 4px; }
    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pager-btns { display: flex; gap: 6px; align-items: center; }
    .thumb-btn {
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
    }
    .thumb-btn:hover .thumb { border-color: var(--accent); transform: scale(1.04); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 14, 0.84);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 1120px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-grid {
      padding: 16px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .gal-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .gal-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: contain;
      background: #fff;
      border-radius: 6px;
      display: block;
    }
    .gal-cap {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      word-break: break-all;
    }
    .wall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .wall-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .wall-card:hover { border-color: var(--accent); }
    .wall-card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: contain;
      background: #fff;
      border-radius: 8px;
      display: block;
    }
    .wall-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-decoration: none;
    }
    .wall-title:hover { color: var(--accent); }
    .wall-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: auto;
    }
    .pid a { color: inherit; }
    .is-hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Kiểm tra toàn bộ sản phẩm TTGShop</h1>
        <div class="sub" id="scrapedMeta">Đang tải dữ liệu...</div>
      </div>
      <div class="actions">
        <a class="btn" href="./all_products.csv" download>Tải toàn bộ CSV</a>
        <a class="btn" href="./all_products.json" target="_blank">Xem JSON gốc</a>
        <button class="btn btn-primary" id="exportFilteredBtn" type="button">Xuất CSV theo bộ lọc</button>
      </div>
    </header>

    <section class="stats-grid" id="statsGrid"></section>

    <div class="toolbar">
      <input type="search" id="searchInput" aria-label="Tìm kiếm sản phẩm" placeholder="Tìm theo tên sản phẩm, mã ID, CPU, RTX, RAM, màn hình..." />
      <select id="catFilter" aria-label="Lọc theo danh mục" title="Lọc theo danh mục">
        <option value="all">Tất cả danh mục</option>
      </select>
      <select id="statusFilter" aria-label="Lọc theo trạng thái" title="Lọc theo trạng thái">
        <option value="all">Tất cả trạng thái</option>
        <option value="in">Còn hàng</option>
        <option value="out">Hết hàng</option>
        <option value="contact">Giá Liên hệ</option>
      </select>
      <select id="sortFilter" aria-label="Sắp xếp sản phẩm" title="Sắp xếp sản phẩm">
        <option value="default">Thứ tự trang web</option>
        <option value="price-asc">Giá: Thấp đến Cao</option>
        <option value="price-desc">Giá: Cao đến Thấp</option>
        <option value="name-asc">Tên: A - Z</option>
      </select>
      <select id="viewMode" aria-label="Chế độ hiển thị" title="Chế độ hiển thị">
        <option value="table">Dạng bảng (Theo SP)</option>
        <option value="gallery">Lưới tất cả ảnh</option>
      </select>
      <div class="result-meta" id="resultMeta">0 sản phẩm</div>
    </div>

    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Ảnh</th>
            <th>Sản phẩm & Cấu hình</th>
            <th>Danh mục / Trang</th>
            <th>Giá bán</th>
            <th>Trạng thái</th>
            <th>Bảo hành</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="wall-grid is-hidden" id="wallGrid"></div>

    <div class="pager">
      <div class="sub" id="pagerInfo"></div>
      <div class="pager-btns">
        <button class="btn" id="prevPage" type="button">Trang trước</button>
        <select id="pageSizeSel" aria-label="Số sản phẩm mỗi trang" title="Số sản phẩm mỗi trang">
          <option value="50">50 / trang</option>
          <option value="100" selected>100 / trang</option>
          <option value="250">250 / trang</option>
          <option value="9999">Hiện tất cả</option>
        </select>
        <button class="btn" id="nextPage" type="button">Trang sau</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="albumModal">
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="albumTitle">Album ảnh</div>
          <div class="sub" id="albumSub"></div>
        </div>
        <button class="btn" id="albumClose" type="button">Đóng</button>
      </div>
      <div class="modal-grid" id="albumGrid"></div>
    </div>
  </div>

  <script>
    const state = {
      all: [],
      summary: null,
      filtered: [],
      flatImages: [],
      cat: 'all',
      status: 'all',
      sort: 'default',
      q: '',
      view: 'table',
      page: 1,
      pageSize: 100
    };

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function init() {
      const res = await fetch('./all_products.json');
      const data = await res.json();
      state.all = data.products || [];
      state.summary = data.summary || {};

      const imgInfo = state.summary.totalImagesDownloadedOrCached
        ? ` • ${state.summary.totalImagesDownloadedOrCached.toLocaleString('vi-VN')} ảnh album (${state.summary.totalImagesSizeMB} MB)`
        : '';
      document.getElementById('scrapedMeta').textContent =
        `Tổng ${state.all.length.toLocaleString('vi-VN')} sản phẩm (${state.summary.uniqueIds ?? state.all.length} mã ID duy nhất)${imgInfo} • Nguồn: ttgshop.vn`;

      const statsGrid = document.getElementById('statsGrid');
      const catSel = document.getElementById('catFilter');

      const allCard = document.createElement('div');
      allCard.className = 'stat-card active';
      allCard.dataset.cat = 'all';
      const catCount = (state.summary.categories || []).length;
      const totalPages = (state.summary.categories || []).reduce((s, c) => s + (c.pages || 0), 0);
      allCard.innerHTML = `<div class="k">TẤT CẢ ${catCount} LINK</div><div class="v">${state.all.length.toLocaleString('vi-VN')}</div><div class="m">${totalPages} trang${state.summary.totalImagesDownloadedOrCached ? ` • ${state.summary.totalImagesDownloadedOrCached.toLocaleString('vi-VN')} ảnh` : ''}</div>`;
      allCard.onclick = () => selectCat('all');
      statsGrid.appendChild(allCard);

      for (const c of state.summary.categories || []) {
        const opt = document.createElement('option');
        opt.value = c.key;
        opt.textContent = `${c.label} (${c.count})`;
        catSel.appendChild(opt);

        const card = document.createElement('div');
        card.className = 'stat-card';
        card.dataset.cat = c.key;
        const gTxt = c.galleryImagesCount ? ` • ${c.galleryImagesCount.toLocaleString('vi-VN')} ảnh` : '';
        card.innerHTML = `<div class="k">${esc(c.label)}</div><div class="v">${c.count.toLocaleString('vi-VN')}</div><div class="m">${c.pages} trang • Còn: ${c.inStock} • Hết: ${c.outStock}${gTxt}</div>`;
        card.onclick = () => selectCat(c.key);
        statsGrid.appendChild(card);
      }

      document.getElementById('searchInput').addEventListener('input', e => {
        state.q = e.target.value.trim().toLowerCase();
        state.page = 1;
        applyFilter();
      });
      catSel.addEventListener('change', e => selectCat(e.target.value));
      document.getElementById('statusFilter').addEventListener('change', e => {
        state.status = e.target.value;
        state.page = 1;
        applyFilter();
      });
      document.getElementById('sortFilter').addEventListener('change', e => {
        state.sort = e.target.value;
        state.page = 1;
        applyFilter();
      });
      document.getElementById('viewMode').addEventListener('change', e => {
        state.view = e.target.value;
        state.page = 1;
        renderCurrentView();
      });
      document.getElementById('pageSizeSel').addEventListener('change', e => {
        state.pageSize = Number(e.target.value);
        state.page = 1;
        renderCurrentView();
      });
      document.getElementById('prevPage').onclick = () => {
        if (state.page > 1) { state.page--; renderCurrentView(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      };
      document.getElementById('nextPage').onclick = () => {
        const listLen = state.view === 'gallery' ? state.flatImages.length : state.filtered.length;
        const maxP = Math.max(1, Math.ceil(listLen / state.pageSize));
        if (state.page < maxP) { state.page++; renderCurrentView(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      };
      document.getElementById('exportFilteredBtn').onclick = exportFilteredCsv;

      const params = new URLSearchParams(location.search);
      const qCat = params.get('cat');
      const qView = params.get('view');
      if (qView === 'gallery') {
        state.view = 'gallery';
        document.getElementById('viewMode').value = 'gallery';
      }
      if (qCat && (qCat === 'all' || (state.summary.categories || []).some(c => c.key === qCat))) {
        selectCat(qCat);
      } else {
        applyFilter();
      }
    }

    function selectCat(catKey) {
      state.cat = catKey;
      state.page = 1;
      document.getElementById('catFilter').value = catKey;
      document.querySelectorAll('.stat-card').forEach(el => {
        el.classList.toggle('active', el.dataset.cat === catKey);
      });
      applyFilter();
    }

    function applyFilter() {
      let list = state.all;
      if (state.cat !== 'all') list = list.filter(p => p.categoryKey === state.cat);
      if (state.status === 'in') list = list.filter(p => /còn hàng/i.test(p.status));
      else if (state.status === 'out') list = list.filter(p => /hết hàng/i.test(p.status));
      else if (state.status === 'contact') list = list.filter(p => !p.priceSaleVnd || /liên hệ/i.test(p.priceSale));

      if (state.q) {
        const tokens = state.q.split(/\s+/).filter(Boolean);
        list = list.filter(p => {
          const hay = `${p.id} ${p.name} ${p.specs.join(' ')} ${p.priceSale}`.toLowerCase();
          return tokens.every(t => hay.includes(t));
        });
      }

      if (state.sort === 'price-asc') {
        list = [...list].sort((a, b) => (a.priceSaleVnd ?? 9e15) - (b.priceSaleVnd ?? 9e15));
      } else if (state.sort === 'price-desc') {
        list = [...list].sort((a, b) => (b.priceSaleVnd ?? -1) - (a.priceSaleVnd ?? -1));
      } else if (state.sort === 'name-asc') {
        list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'vi'));
      }

      state.filtered = list;
      state.flatImages = [];
      for (const p of list) {
        const imgs = (p.galleryLocalPaths && p.galleryLocalPaths.length) ? p.galleryLocalPaths : [p.image];
        imgs.forEach((src, i) => {
          const isDesc = String(src).includes('/desc_') || String(src).startsWith('desc_');
          state.flatImages.push({ p, src: src.startsWith('http') ? src : `../${src}`, idx: i + 1, isDesc });
        });
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      const tableWrap = document.getElementById('tableWrap');
      const wallGrid = document.getElementById('wallGrid');
      const isGallery = state.view === 'gallery';
      tableWrap.classList.toggle('is-hidden', isGallery);
      wallGrid.classList.toggle('is-hidden', !isGallery);
      if (isGallery) {
        document.getElementById('resultMeta').textContent =
          `${state.flatImages.length.toLocaleString('vi-VN')} ảnh (${state.filtered.length.toLocaleString('vi-VN')} SP)`;
        renderGalleryWall();
      } else {
        document.getElementById('resultMeta').textContent =
          `Hiển thị ${state.filtered.length.toLocaleString('vi-VN')} / ${state.all.length.toLocaleString('vi-VN')} sản phẩm`;
        renderTable();
      }
    }

    function renderGalleryWall() {
      const total = state.flatImages.length;
      const maxP = Math.max(1, Math.ceil(total / state.pageSize));
      if (state.page > maxP) state.page = maxP;
      const start = (state.page - 1) * state.pageSize;
      const slice = state.flatImages.slice(start, start + state.pageSize);
      document.getElementById('wallGrid').innerHTML = slice.map(item => `
        <div class="wall-card">
          <a href="${esc(item.src)}" target="_blank" rel="noopener">
            <img loading="lazy" src="${esc(item.src)}" alt="" onerror="this.src='${esc(item.p.image)}'" />
          </a>
          <a class="wall-title" href="${esc(item.p.url)}" target="_blank" rel="noopener" title="${esc(item.p.name)}">${esc(item.p.name)}</a>
          <div class="wall-meta">
            <span>${item.isDesc ? 'Mô tả' : 'Gallery'} #${item.idx}</span>
            <span>${esc(item.p.priceSale)}</span>
          </div>
        </div>
      `).join('');
      document.getElementById('pagerInfo').textContent =
        total ? `Trang ${state.page} / ${maxP} (ảnh ${start + 1} - ${Math.min(start + slice.length, total)} / ${total})` : 'Không có ảnh phù hợp';
      document.getElementById('prevPage').disabled = state.page <= 1;
      document.getElementById('nextPage').disabled = state.page >= maxP;
    }

    function renderTable() {
      const total = state.filtered.length;
      const maxP = Math.max(1, Math.ceil(total / state.pageSize));
      if (state.page > maxP) state.page = maxP;
      const start = (state.page - 1) * state.pageSize;
      const slice = state.filtered.slice(start, start + state.pageSize);

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = slice.map(p => {
        const isOut = /hết hàng/i.test(p.status);
        const specsHtml = p.specs && p.specs.length
          ? `<ul class="specs">${p.specs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`
          : '';
        const thumbSrc = p.imageLocal ? `../${p.imageLocal}` : p.image;
        const gCount = p.galleryCount || (p.galleryLocalPaths && p.galleryLocalPaths.length) || 1;
        return `
          <tr>
            <td>${p.sttInCategory ?? p.sttGlobal}<div class="pid">#${p.sttGlobal}</div></td>
            <td>
              <button class="thumb-btn" type="button" onclick="openAlbum('${esc(p.id)}')" title="Xem tất cả ảnh">
                <img class="thumb" loading="lazy" src="${esc(thumbSrc)}" alt="" onerror="this.src='${esc(p.image)}'" />
                <span>${gCount} ảnh</span>
              </button>
            </td>
            <td>
              <a class="pname" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>
              <div class="pid">ID: ${esc(p.id || '-')} • <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace('https://ttgshop.vn',''))}</a></div>
              ${specsHtml}
            </td>
            <td><span class="badge badge-cat">${esc(p.categoryLabel)}</span><div class="pid">Trang ${p.page} (Vị trí ${p.indexOnPage})</div></td>
            <td>
              <div class="price-sale">${esc(p.priceSale)}</div>
              ${p.priceMarket ? `<div class="price-mkt">${esc(p.priceMarket)}</div>` : ''}
              ${p.discount ? `<span class="badge badge-off">${esc(p.discount)}</span>` : ''}
            </td>
            <td><span class="badge ${isOut ? 'badge-out' : 'badge-ok'}">${esc(p.status || '-')}</span></td>
            <td>${esc(p.warranty || '-')}</td>
          </tr>`;
      }).join('');

      document.getElementById('pagerInfo').textContent =
        total ? `Trang ${state.page} / ${maxP} (mục ${start + 1} - ${Math.min(start + slice.length, total)})` : 'Không có sản phẩm phù hợp';
      document.getElementById('prevPage').disabled = state.page <= 1;
      document.getElementById('nextPage').disabled = state.page >= maxP;
    }

    function openAlbum(id) {
      const p = state.all.find(x => String(x.id) === String(id));
      if (!p) return;
      const locals = p.galleryLocalPaths && p.galleryLocalPaths.length ? p.galleryLocalPaths.map(lp => `../${lp}`) : [];
      const remotes = p.galleryUrls && p.galleryUrls.length ? p.galleryUrls : [p.imageFull || p.image];
      const list = locals.length ? locals : remotes;
      document.getElementById('albumTitle').textContent = p.name;
      document.getElementById('albumSub').textContent = `ID: ${p.id} • ${list.length} ảnh góc chụp • ${p.categoryLabel}`;
      document.getElementById('albumGrid').innerHTML = list.map((src, idx) => {
        const fallback = remotes[idx] || p.image;
        const cap = (p.galleryLocalPaths && p.galleryLocalPaths[idx]) ? p.galleryLocalPaths[idx] : src;
        return `
          <div class="gal-card">
            <a href="${esc(src)}" target="_blank" rel="noopener">
              <img src="${esc(src)}" loading="lazy" alt="" onerror="this.src='${esc(fallback)}'" />
            </a>
            <div class="gal-cap">#${idx + 1}: ${esc(cap)}</div>
          </div>`;
      }).join('');
      document.getElementById('albumModal').classList.add('open');
    }

    document.getElementById('albumClose').onclick = () => document.getElementById('albumModal').classList.remove('open');
    document.getElementById('albumModal').onclick = e => {
      if (e.target.id === 'albumModal') document.getElementById('albumModal').classList.remove('open');
    };

    function exportFilteredCsv() {
      const headers = ["STT", "Danh mục", "Trang", "ID", "Tên sản phẩm", "Giá bán", "Giá niêm yết", "Giảm giá", "Trạng thái", "Bảo hành", "Số ảnh", "Ảnh chính cục bộ", "Cấu hình", "Link"];
      const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const rows = [headers.map(cell).join(",")];
      state.filtered.forEach((r, idx) => {
        rows.push([
          idx + 1, r.categoryLabel, r.page, r.id, r.name,
          r.priceSale, r.priceMarket, r.discount, r.status,
          r.warranty, r.galleryCount ?? 1, r.imageLocal ?? '', (r.specs || []).join(" | "), r.url
        ].map(cell).join(","));
      });
      const blob = new Blob(["\uFEFF" + rows.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `ttgshop_${state.cat}_filtered.csv`;
      a.click();
    }

    init();
  </script>
</body>
</html>
